name: main

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

env:
  LUA_LS_VERSION: 3.7.4
  LUA_VERSION: 5.1
  # nvim-treesitter `main` requires >= 0.26.1. Keep in sync with the Dockerfile.
  TREE_SITTER_VERSION: 0.26.13

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    name: lint
    steps:
      - uses: actions/checkout@v4

      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check . -g '*.lua' -g '!deps/'

  documentation:
    runs-on: ubuntu-latest
    name: documentation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: setup neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: ${{ env.LUA_VERSION }}

      - uses: leafo/gh-actions-luarocks@v4

      # No tree-sitter-cli step here: the documentation target skips the parser
      # install, since mini.doc parses nothing.
      - name: generate documentation
        run: make documentation-ci

      - name: check docs diff
        run: exit $(git status --porcelain doc | wc -l | tr -d " ")

  tests:
    runs-on: ubuntu-latest
    # 1 minute was already marginal before parsers were built from source
    # (52s observed), and a cold gh-actions-lua build can add ~30s.
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # setup-bun installs the latest release, so record which one the run used.
      - run: bun --version

      # nvim-treesitter's `main` branch compiles parsers with tree-sitter-cli.
      - uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: v${{ env.TREE_SITTER_VERSION }}

      - run: tree-sitter --version

      - run: date +%F > todays-date

      - name: restore luals cache
        uses: actions/cache@v4
        id: cache
        with:
          path: .ci/lua-ls
          key: ${{ env.LUA_LS_VERSION }}

      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: ${{ env.LUA_VERSION }}

      - uses: leafo/gh-actions-luarocks@v4

      - name: setup luals
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: mkdir -p .ci/lua-ls && curl -sL "https://github.com/LuaLS/lua-language-server/releases/download/${{ env.LUA_LS_VERSION }}/lua-language-server-${{ env.LUA_LS_VERSION }}-linux-x64.tar.gz" | tar xzf - -C "${PWD}/.ci/lua-ls"

      - name: setup neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          # nvim-treesitter `main` requires nvim 0.12+ and supports only the
          # latest stable release; tests-nightly covers the other half of that
          # policy. Tracking `stable` keeps this from silently going stale.
          version: stable

      - name: run luals
        run: |
          export PATH="${PWD}/.ci/lua-ls/bin:${PATH}"
          nvim --version
          make luals-ci

      - name: run tests
        run: make test-ci

      - name: Test packing luarock
        run: luarocks pack neotest-bun-scm-1.rockspec

      - name: Archive logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-nvim-stable
          path: tmp/.local/state/nvim-neotest-bun-test

  tests-nightly:
    runs-on: ubuntu-latest
    # Parsers are compiled from source on each run.
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # setup-bun installs the latest release, so record which one the run used.
      - run: bun --version

      # nvim-treesitter's `main` branch compiles parsers with tree-sitter-cli.
      - uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: v${{ env.TREE_SITTER_VERSION }}

      - run: tree-sitter --version

      - run: date +%F > todays-date

      - name: restore cache for today's nightly.
        uses: actions/cache@v4
        with:
          path: _neovim
          key: ${{ runner.os }}-x64-${{ hashFiles('todays-date') }}

      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: ${{ env.LUA_VERSION }}

      - uses: leafo/gh-actions-luarocks@v4

      - name: restore luals cache
        uses: actions/cache@v4
        id: cache
        with:
          path: .ci/lua-ls
          key: ${{ env.LUA_LS_VERSION }}

      - name: setup luals
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: mkdir -p .ci/lua-ls && curl -sL "https://github.com/LuaLS/lua-language-server/releases/download/${{ env.LUA_LS_VERSION }}/lua-language-server-${{ env.LUA_LS_VERSION }}-linux-x64.tar.gz" | tar xzf - -C "${PWD}/.ci/lua-ls"

      - name: setup neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly

      - name: run luals
        run: |
          export PATH="${PWD}/.ci/lua-ls/bin:${PATH}"
          nvim --version
          make luals-ci

      - name: run tests
        run: make test-ci

      - name: Archive logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-nvim-nightly
          path: tmp/.local/state/nvim-neotest-bun-test

